name: check
run-name: "check ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
    - main
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  pre-release-version-check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: install pre-release
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s pre-release
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: get stable version info
      id: stable
      run: |
        curl -fsSL https://cli.moonbitlang.com/version.json > version.json
        STABLE_MOONC_VERSION=$(jq -r '.items[] | select(.name == "moonc") | .version' version.json)
        echo "Stable moonc version: $STABLE_MOONC_VERSION"
        echo "stable-version=$STABLE_MOONC_VERSION" >> $GITHUB_OUTPUT

    - name: get pre-release version info
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
      id: prerelease
      run: |
        PRERELEASE_MOONC_VERSION=$(moonc -v 2>&1 | head -1)
        echo "Pre-release moonc version: $PRERELEASE_MOONC_VERSION"
        echo "prerelease-version=$PRERELEASE_MOONC_VERSION" >> $GITHUB_OUTPUT

    - name: check if pre-release build should run
      id: check
      run: |
        STABLE_MOONC_VERSION="${{ steps.stable.outputs.stable-version }}"
        PRERELEASE_MOONC_VERSION="${{ steps.prerelease.outputs.prerelease-version }}"

        if [[ "$STABLE_MOONC_VERSION" != "$PRERELEASE_MOONC_VERSION" ]]; then
          echo "Pre-release and stable versions differ, running pre-release-build"
          echo "should-run=true" >> $GITHUB_OUTPUT
        else
          echo "Pre-release and stable versions match, skipping pre-release-build"
          echo "should-run=false" >> $GITHUB_OUTPUT
        fi

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  stable-build:
    strategy:
      fail-fast: false
      matrix:
        os:
        - name: ubuntu-latest
    runs-on: ${{ matrix.os.name }}

    env:
      OS_PLATFORM: ${{ matrix.os.name }}

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: install
      if: ${{ matrix.os.name != 'windows-latest' }}
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: install on windows
      if: ${{ matrix.os.name == 'windows-latest' }}
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Setup MSVC
      if: ${{ matrix.os.name == 'windows-latest' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: moon version
      run: |
        moon version --all
        moonrun --version

    - name: moon test
      run: |
        moon test --target all --serial --release
        moon test --target all --serial

    - name: moon test(native)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 30
        max_attempts: 5
        command: |
          moon test --target native --release
          moon test --target native

    - name: moon check
      run: moon check --deny-warn

    - name: moon info
      run: |
        moon info
        git diff --exit-code

    - name: format diff
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
